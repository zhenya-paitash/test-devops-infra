---
- name: "CONFIG | Create docker-compose.yml from template"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jenkins_home_on_host }}/docker-compose.yml"
    owner: '1000'
    group: '1000'
    mode: '0644'
  notify: restart jenkins

- name: "CONFIG | Create Jenkins JCasC file from template"
  ansible.builtin.template:
    src: jenkins.yaml.j2
    dest: "{{ jenkins_home_on_host }}/jenkins.yaml"
    owner: '1000'
    group: '1000'
    mode: '0644'
  notify: restart jenkins