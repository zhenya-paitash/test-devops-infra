---
# infrastructure/ansible/roles/install_jenkins_controller/defaults/main.yml

# User and Group settings
jenkins_user: "jenkins"
jenkins_group: "jenkins"
# Optionally enforce a specific UID/GID. Leave empty for auto-assignment.
jenkins_uid: 1002
jenkins_gid: 1002

# Jenkins Controller Settings
jenkins_image: "jenkins/jenkins:lts-jdk17"
jenkins_container_name: "jenkins-controller"
jenkins_home_on_host: "/var/jenkins_home"
jenkins_http_port: 8080
jenkins_jnlp_port: 50000

# JCasC (Jenkins Configuration as Code)
jenkins_casc_configs_dir: "{{ jenkins_home_on_host }}/casc_configs"

# Default plugins to install
jenkins_plugins:
  # Core Pipeline
  - name: "workflow-aggregator"
  # SCM and Git - explicitly add dependencies to fix errors
  - name: "git"
  - name: "scm-api"
  - name: "branch-api"
  # JCasC and Agents
  - name: "configuration-as-code"
  - name: "kubernetes"
  # UI and Usability
  - name: "blueocean"
  - name: "timestamper"
  - name: "ws-cleanup"
  - name: "ansicolor"

# Kubernetes Agent Settings
jenkins_k8s_cluster_url: "https://kubernetes.default.svc"
jenkins_k8s_namespace: "jenkins-agents"
jenkins_k8s_service_account_name: "jenkins-agent"
jenkins_k8s_agent_image: "jenkins/inbound-agent:latest"
jenkins_k8s_agent_name: "default-agent"

# Credentials (will be populated dynamically)
jenkins_k8s_service_account_token: ""
