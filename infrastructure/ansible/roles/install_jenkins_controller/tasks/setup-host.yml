---
# infrastructure/ansible/roles/install_jenkins_controller/tasks/setup-host.yml

- name: Create {{ jenkins_group }} group
  ansible.builtin.group:
    name: "{{ jenkins_group }}"
    gid: "{{ jenkins_gid | int if jenkins_gid != '' else omit }}"
    state: present

- name: Create {{ jenkins_user }} user
  ansible.builtin.user:
    name: "{{ jenkins_user }}"
    uid: "{{ jenkins_uid | int if jenkins_uid != '' else omit }}"
    group: "{{ jenkins_group }}"
    home: "{{ jenkins_home_on_host }}"
    shell: /bin/bash
    state: present

- name: Create Jenkins home directory
  ansible.builtin.file:
    path: "{{ jenkins_home_on_host }}"
    state: directory
    owner: '1000'
    group: '1000'
    mode: '0755'
    recurse: yes
