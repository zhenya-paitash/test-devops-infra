---
kafka_user: kafka
kafka_user_group: kafka
kafka_home: /opt/kafka
kafka_version: 4.0.0  # WARN: сейчас все приложения используют v3.7.0
kafka_scala_version: 2.13
kafka_java_version: 17
kafka_install_dependencies: false
# if kafka_checksum is defined role will use that value instead getting checksum from kafka downloads page
# kafka_checksum: >
#   sha512: B8679283 A2D8DAB8 6E7C636B 2C688FE9 D9E64AC4
#   37241F65 EF7A1733 F4D26A2B D415EEFA 04F09F19 11373BCD
#   2A5DBC38 38C76347 F6865642 5C09202C D290CE91
kafka_download_directory: /opt
kafka_log_directory: /var/log/kafka # this is actual kafka service log desitnation. not to be confused with kafka logs
kafka_heap_size: 1G
kafka_opts: [] # this can be list or string
# - -XX:NewSize=256m
kafka_additional_config:
  auto.create.topics.enable: "true"
#  message.max.bytes: 1000

# if not defined, it will be generated randomly
# kafka_cluster_id: "b7e1e2c2-7e2a-4b7a-8e2d-1a2b3c4d5e6f"

kafka_topics: []
# - name: topic1
# - name: topic2
#   replication_factor: 3
#   partitions: 10

# Socket Server Settings
kafka_num_network_threads: 3
kafka_num_io_threads: 8
kafka_socket_send_buffer_bytes: 102400
kafka_socket_recieve_buffer_bytes: 102400
kafka_socket_request_max_bytes: 104857600
kafka_inter_broker_listener_name: PLAINTEXT
kafka_listeners: []
#  - PLAINTEXT://:9092
#  - CONTROLLER://:9093

## Log retention policy
kafka_log_retention_hours: 24 # хранить данные в топиках 24 часа и удалять
kafka_log_retention_bytes: 0 # ограничения по размеру. Откл. Игннорировать
kafka_log_retention_check_interval_ms: 300000 # проверять необходимость удаления каждые 5m.
kafka_log_segment_bytes: 1073741824 # размер сегмента лога 1 ГБ (это 1024*1024*1024 байт)

## Log basics
kafka_num_partitions: 1
kafka_log_dirs:
  - /data/kafka

## Server basics
kafka_node_roles:
  - broker
  - controller

## Replication
# kafka_replication_factor: 1 # INFO: сейчас не используется

## Internal topic settings
kafka_offsets_topic_replication_factor: 1
kafka_transaction_state_log_replication_factor: 1
kafka_transaction_state_log_min_isr: 1 # сколько реплик должны подтвердить запись
# TODO: создать кластер
# kafka_offsets_topic_replication_factor: 3
# kafka_transaction_state_log_replication_factor: 3
# kafka_transaction_state_log_min_isr: 2

## Kafka Exporter
kafka_exporter_install: true
kafka_exporter_version: "1.9.0"  # WARN: stable 1.7.0
kafka_exporter_user: kafka-exporter
kafka_exporter_group: kafka-exporter
kafka_exporter_port: 9308
kafka_exporter_kafka_server: "localhost:9092"
kafka_exporter_download_url: "https://github.com/danielqsj/kafka_exporter/releases/download/v{{ kafka_exporter_version }}/kafka_exporter-{{ kafka_exporter_version }}.linux-amd64.tar.gz"
kafka_exporter_binary_path: /usr/local/bin/kafka_exporter
kafka_exporter_additional_opts: ""

## Limits
kafka_cpu_quota: "200%" # 2 ядра 
kafka_memory_limit: "2G"
