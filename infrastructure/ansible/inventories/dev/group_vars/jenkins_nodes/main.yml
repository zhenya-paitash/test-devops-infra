# ┌───────────────────────────────────────────────────────────────────────────┐
# │ @category   Ansible Group Variables                                       │
# │ @scope      Переменные для группы [jenkins_nodes] в окружении [dev]       │
# │ @purpose    Переопределение дефолтных значений из роли 'install_jenkins'  │
# └───────────────────────────────────────────────────────────────────────────┘
---

# -----------------------------------------------------------------------------
# @section     Основные параметры Jenkins
# @description Эти переменные определяют базовое поведение и доступ к Jenkins.
#              `jenkins_admin_password` КРАЙНЕ рекомендуется менять для production.
# -----------------------------------------------------------------------------
jenkins_admin_password: "admin"
jenkins_force_clean_install: true
jenkins_url: ""  # Оставьте пустым для авто-определения, или укажите FQDN, например http://jenkins.mycompany.com
jenkins_tunnel: "" # Оставьте пустым для авто-определения

# -----------------------------------------------------------------------------
# @section     Управление ресурсами
# @description Настройки лимитов и запросов ресурсов для контейнера Jenkins.
# -----------------------------------------------------------------------------
jenkins_resource_limits_enabled: true
jenkins_cpu_limit: '1.0'
jenkins_mem_limit: '2g'
jenkins_mem_reservation: '1g'

# -----------------------------------------------------------------------------
# @section     Настройки кэширования для Kubernetes агентов
# @description Параметры для PersistentVolumeClaim, используемого для кэша.
# -----------------------------------------------------------------------------
jenkins_agent_pvc_enabled: true
jenkins_agent_pvc_name: "jenkins-agent-cache-pvc"
jenkins_agent_pvc_size: "10Gi"
jenkins_agent_pvc_storage_class: "" # Укажите StorageClass, если необходимо

# -----------------------------------------------------------------------------
# @section     Дополнительные плагины
# @description Список плагинов, которые будут установлены вдобавок к основным.
# -----------------------------------------------------------------------------
# jenkins_plugins_extra:
#   - { name: "blueocean", version: "1.25.3" }

